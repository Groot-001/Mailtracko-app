services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ../env/.env.development
    environment:
      ENVIRONMENT: development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    env_file:
      - ../env/.env.development
    environment:
      ENVIRONMENT: development
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: mail-tracko-local-backend
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../env/.env.development
    environment:
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../src:/app/src
      - ../scripts:/app/scripts
      - ../alembic.ini:/app/alembic.ini
      - app_logs:/logs
    command:
      [
        "uvicorn",
        "src.main:create_app",
        "--factory",
        "--app-dir",
        "/app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    ports:
      - "8080:8000"
    restart: unless-stopped

  background_worker:
    image: mail-tracko-local-backend
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../env/.env.development
    environment:
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["dramatiq", "src.modules.campaign.infrastructure.background_tasks.campaign_tasks"]
    restart: unless-stopped

  campaign_scheduler:
    image: mail-tracko-local-backend
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../env/.env.development
    environment:
      ENVIRONMENT: development
      CAMPAIGN_SCHEDULER_INTERVAL_SECONDS: 10
    depends_on:
      background_worker:
        condition: service_started
    command: ["python", "scripts/campaign/run_scheduler.py"]
    restart: unless-stopped

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    env_file:
      - ../env/.env.development
    environment:
      ENVIRONMENT: development
    ports:
      - "8428:8428"
    restart: unless-stopped

volumes:
  postgres_data:
  app_logs:
