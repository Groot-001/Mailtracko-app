[project]
name = "mail-tracko"
version = "0.1.0"
description = "Email outreach platform for campaigns, deliverability, and analytics"
readme = "README.md"
# Dependency set is validated for Python 3.13; pin the upper bound so uv does
# not attempt an unsupported Python 3.14 dependency split during deployment.
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]>=0.136.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.31.0",
    "psycopg2>=2.9.0",
    "alembic>=1.18.0",
    "redis>=7.4.0",
    "dramatiq>=2.1.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "dependency-injector>=4.49.0",
    "pyjwt>=2.12.0",
    "argon2-cffi>=25.1.0",
    "httpx>=0.28.0",
    "aiosmtplib>=5.1.0",
    "jinja2>=3.1.0",
    "authlib>=1.7.2",
    "validators>=0.35.0",
    "dnspython>=2.6.0",
    "python-dotenv>=1.2.0",
    "python-json-logger>=4.1.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "sentry-sdk>=2.0.0",
    "itsdangerous>=2.2.0",
    "python-socketio[asyncio]>=5.11.0",
    "user-agents>=2.2.0",
    "aioboto3>=15.5.0",
    "cloudinary>=1.45.0",
    "pyotp>=2.10.0",
    "qrcode[pil]>=8.2.0",
    "tzdata>=2026.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
addopts = "-v -r w"
filterwarnings = [
    "ignore:The garbage collector is trying to clean up non-checked-in connection:sqlalchemy.exc.SAWarning",
]

[tool.ruff.lint]
ignore = ["F403"]
