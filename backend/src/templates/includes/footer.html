<tr>
    <td style="padding:0 40px 36px 40px;background:#ffffff;text-align:center;">

        <!-- Social Icons Row -->
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 auto 16px auto;">
            <tr>
                <td style="padding:0 5px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:36px;height:36px;background:#f1f5f9;border-radius:50%;" align="center">
                        <tr>
                            <td style="text-align:center;vertical-align:middle;font-size:0;line-height:0;">
                                <a href="{{ facebook_url|default('#') }}" style="text-decoration:none;">
                                    <img src="{{ facebook_src }}" alt="Facebook" width="18" height="18" style="border:0;display:block;margin:0 auto;">
                                </a>
                            </td>
                        </tr>
                    </table>
                </td>
                <td style="padding:0 5px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:36px;height:36px;background:#f1f5f9;border-radius:50%;" align="center">
                        <tr>
                            <td style="text-align:center;vertical-align:middle;font-size:0;line-height:0;">
                                <a href="{{ x_url|default('#') }}" style="text-decoration:none;">
                                    <img src="{{ x_src }}" alt="X" width="18" height="18" style="border:0;display:block;margin:0 auto;">
                                </a>
                            </td>
                        </tr>
                    </table>
                </td>
                <td style="padding:0 5px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:36px;height:36px;background:#f1f5f9;border-radius:50%;" align="center">
                        <tr>
                            <td style="text-align:center;vertical-align:middle;font-size:0;line-height:0;">
                                <a href="{{ linkedin_url|default('#') }}" style="text-decoration:none;">
                                    <img src="{{ linkedin_src }}" alt="LinkedIn" width="18" height="18" style="border:0;display:block;margin:0 auto;">
                                </a>
                            </td>
                        </tr>
                    </table>
                </td>
                <td style="padding:0 5px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:36px;height:36px;background:#f1f5f9;border-radius:50%;" align="center">
                        <tr>
                            <td style="text-align:center;vertical-align:middle;font-size:0;line-height:0;">
                                <a href="{{ instagram_url|default('#') }}" style="text-decoration:none;">
                                    <img src="{{ instagram_src }}" alt="Instagram" width="18" height="18" style="border:0;display:block;margin:0 auto;">
                                </a>
                            </td>
                        </tr>
                    </table>
                </td>
                <td style="padding:0 5px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:36px;height:36px;background:#f1f5f9;border-radius:50%;" align="center">
                        <tr>
                            <td style="text-align:center;vertical-align:middle;font-size:0;line-height:0;">
                                <a href="{{ youtube_url|default('#') }}" style="text-decoration:none;">
                                    <img src="{{ youtube_src }}" alt="YouTube" width="18" height="18" style="border:0;display:block;margin:0 auto;">
                                </a>
                            </td>
                        </tr>
                    </table>
                </td>
                <td style="padding:0 5px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:36px;height:36px;background:#f1f5f9;border-radius:50%;" align="center">
                        <tr>
                            <td style="text-align:center;vertical-align:middle;font-size:0;line-height:0;">
                                <a href="{{ thread_url|default('#') }}" style="text-decoration:none;">
                                    <img src="{{ thread_src }}" alt="Threads" width="18" height="18" style="border:0;display:block;margin:0 auto;">
                                </a>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>

        <!-- Navigation Links -->
        <p style="margin:0 0 16px 0;font-size:13px;font-weight:500;color:#64748b;">
            <a href="{{ blog_url|default('#') }}" style="color:#64748b;text-decoration:none;">Blog</a>
            <span style="padding:0 8px;color:#cbd5e1;">|</span>
            <a href="{{ events_url|default('#') }}" style="color:#64748b;text-decoration:none;">Events</a>
            <span style="padding:0 8px;color:#cbd5e1;">|</span>
            <a href="{{ academy_url|default('#') }}" style="color:#64748b;text-decoration:none;">Academy</a>
            <span style="padding:0 8px;color:#cbd5e1;">|</span>
            <a href="{{ community_url|default('#') }}" style="color:#64748b;text-decoration:none;">Community</a>
        </p>

        {% if recipient_email %}
        <p style="margin:0 0 20px 0;font-size:12px;color:#94a3b8;">
            This email was sent to <span style="color:#6c2bd9;font-weight:500;">{{ recipient_email }}</span>.
        </p>
        {% endif %}

        <!-- Divider -->
        <div style="border-top:1px solid #e2e8f0;margin:20px 0 24px 0;"></div>

        <!-- Footer Brand & Tagline -->
        <div style="margin-bottom:8px;">
            <span style="font-size:15px;font-weight:700;color:#1e293b;letter-spacing:-0.02em;">MailTracko</span>
        </div>

        <p style="margin:0 0 6px 0;font-size:12px;color:#64748b;line-height:1.5;">
            MailTracko — Cold Email That Converts. Deliverability That Lasts.
        </p>
        <p style="margin:0 0 16px 0;font-size:11px;color:#94a3b8;">
            &copy; {{ year }} MailTracko. All rights reserved.
        </p>

        <!-- Legal Links -->
        <p style="margin:0;font-size:12px;font-weight:500;color:#6c2bd9;">
            <a href="{{ help_url|default('#') }}" style="color:#6c2bd9;text-decoration:none;">Help Center</a>
            <span style="padding:0 8px;color:#cbd5e1;">|</span>
            <a href="{{ privacy_url|default('#') }}" style="color:#6c2bd9;text-decoration:none;">Privacy Policy</a>
            <span style="padding:0 8px;color:#cbd5e1;">|</span>
            <a href="{{ unsubscribe_url|default('#') }}" style="color:#6c2bd9;text-decoration:none;">Unsubscribe</a>
        </p>

    </td>
</tr>
