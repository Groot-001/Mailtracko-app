<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MailTracko{% endblock %}</title>
    <!--[if mso]>
    <style type="text/css">
        table {border-collapse: collapse;}
        td, th {font-family: Arial, sans-serif;}
    </style>
    <![endif]-->
    <style>
        .heading { font-size: 35px; font-weight: 800; color: #6c2bd9; letter-spacing: -0.02em; margin: 0 0 8px 0; }
        .heading-red { font-size: 35px; font-weight: 800; color: #dc2626; letter-spacing: -0.02em; margin: 0 0 8px 0; }
        .subtitle { font-size: 15px; color: #64748b; line-height: 1.5; margin: 0; }
        .greeting { font-size: 17px; font-weight: 700; color: #1e293b; margin: 0 0 12px 0; }
        .greeting-name { color: #6c2bd9; }
        .greeting-name-red { color: #dc2626; }
        .body-text { font-size: 14px; line-height: 1.6; color: #475569; margin: 0 0 20px 0; }
        .body-text-sm { font-size: 14px; line-height: 1.6; color: #475569; margin: 0 0 16px 0; }
        .card { background: #f5f3ff; border: 1px solid #ddd6fe; border-radius: 16px; padding: 28px 32px; margin-bottom: 28px; }
        .card-red { background: #fef2f2; border: 1px solid #fecaca; border-radius: 16px; padding: 28px 32px; margin-bottom: 28px; }
        .code-box { background: #ffffff; border: 1px solid #c4b5fd; border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(108,43,217,0.06); }
        .code-label { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #7c3aed; margin-bottom: 6px; }
        .code-label-red { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #b91c1c; margin-bottom: 6px; }
        .code-value { font-size: 32px; line-height: 1.2; font-weight: 800; letter-spacing: 0.2em; color: #6c2bd9; font-family: Consolas, Monaco, monospace; }
        .btn-primary { display: inline-block; width: 100%; max-width: 320px; padding: 14px 28px; background: #6c2bd9; color: #ffffff; text-decoration: none; border-radius: 12px; font-size: 15px; font-weight: 700; text-align: center; box-sizing: border-box; box-shadow: 0 4px 12px rgba(108,43,217,0.25); }
        .btn-gradient { display: inline-block; padding: 14px 36px; background: linear-gradient(135deg, #7c3aed 0%, #6c2bd9 100%); color: #ffffff; text-decoration: none; font-weight: 700; font-size: 15px; border-radius: 12px; box-shadow: 0 4px 14px rgba(108,43,217,0.35); }
        .small-text { font-size: 12px; color: #64748b; text-align: center; margin: 0; }
        .divider { border-top: 1px solid #e2e8f0; margin: 0 0 16px 0; }
        .support-text { font-size: 14px; color: #475569; margin: 0 0 4px 0; }
        .support-signoff { font-size: 14px; font-weight: 600; color: #1e293b; margin: 0; }

        @media only screen and (max-width: 620px) {
            .email-container { width: 100% !important; padding: 10px !important; }
            .content-cell { padding: 24px 20px !important; }
            .inner-card { padding: 20px 16px !important; }
            .cta-button { display: block !important; width: 100% !important; box-sizing: border-box !important; text-align: center !important; }
        }
    </style>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;color:#1e293b;-webkit-font-smoothing:antialiased;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f5f7;min-height:100vh;">
    <tr>
        <td align="center" style="padding:40px 15px;">

            <!-- Main Email Card -->
            <table class="email-container" role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff;border-radius:20px;border:1px solid #e2e8f0;overflow:hidden;box-shadow:0 4px 25px rgba(0,0,0,0.03);margin:0 auto;">

                <!-- Header -->
                {% include "includes/header.html" %}

                <!-- Content Area -->
                <tr>
                    <td class="content-cell" style="padding:24px 40px 16px 40px;background:#ffffff;">
                        {% block content %}
                        {% endblock %}
                    </td>
                </tr>

                <!-- Footer -->
                {% include "includes/footer.html" %}

            </table>

        </td>
    </tr>
</table>

</body>
</html>
